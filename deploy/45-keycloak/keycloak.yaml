# Keycloak as the OIDC identity provider for Grafana SSO.
#
# Dev mode (start-dev): embedded H2, no external DB. The realm is auto-imported on start from
# the `keycloak-realm` ConfigMap (generated by the Makefile from config/tenants.yaml via
# tools/keycloak-realm/generate_realm.py). H2 is ephemeral, so the realm JSON is the source of
# truth and is re-seeded on every restart.
#
# Reached at http://<minikube-ip>:30080 (NodePort) — one URL that both the browser and the
# in-cluster Grafana pod can hit on Linux/docker-driver, so the OIDC issuer stays consistent.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: observability
  labels: { app: keycloak }
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.0
          args: ["start-dev", "--import-realm"]
          env:
            # Temporary bootstrap admin for the master realm (v26 env names).
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }
            # Expose /health/* on the management port (9000) for probes.
            - { name: KC_HEALTH_ENABLED, value: "true" }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 5
            failureThreshold: 60   # allow up to ~5m for first boot + realm import
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: observability
  labels: { app: keycloak }
spec:
  type: NodePort
  selector: { app: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: 30080 }
