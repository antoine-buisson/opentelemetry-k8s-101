# Shared S3 credentials for the RustFS backend, consumed by the bucket-create Job and
# referenced (by value) in the Mimir/Loki/Tempo storage config. Demo values only.
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: observability
type: Opaque
stringData:
  # Must match deploy/10-storage/rustfs-values.yaml -> secret.rustfs.*
  AWS_ACCESS_KEY_ID: "otel-demo"
  AWS_SECRET_ACCESS_KEY: "otel-demo-secret-key-change-me"
  # RustFS S3 endpoint (in-cluster). Path-style, plain HTTP.
  S3_ENDPOINT: "http://rustfs-svc.observability.svc.cluster.local:9000"
