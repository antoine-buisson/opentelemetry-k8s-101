# One Instrumentation CR per TEAM namespace. The OTEL Operator injects the Python SDK
# into pods annotated `instrumentation.opentelemetry.io/inject-python: "true"`.
#
# Signal breakdown after the classic-signals migration:
#   traces  -> OTLP auto-instrumentation (Flask + requests HTTP spans) via this CR
#              + Jaeger-format business spans emitted manually in app.py
#   metrics -> Prometheus scrape on :9090 (prometheus_client) — NOT OTLP
#   logs    -> filelog sidecar tails /var/log/app/app.log — NOT OTLP
#
# All teams share the single gateway collector; the routing connector inside it
# uses the tenant/team resource attributes to fan out to the correct backend tenant.
#
# Rendered by the Makefile collectors target from config/tenants.yaml.
#   __NAMESPACE__  team namespace
#   __TENANT__     tenant-a | tenant-b
#   __TEAM__       team-1 | team-2
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: python
  namespace: __NAMESPACE__
spec:
  exporter:
    endpoint: http://gateway-collector.observability.svc.cluster.local:4318
  propagators: [tracecontext, baggage]
  sampler:
    type: parentbased_always_on
  resource:
    resourceAttributes:
      tenant: __TENANT__
      team: __TEAM__
  env:
    - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
    # Traces only: metrics and logs use classic formats (Prometheus scrape + filelog sidecar).
    - { name: OTEL_METRICS_EXPORTER, value: none }
    - { name: OTEL_LOGS_EXPORTER,    value: none }
