# One Instrumentation CR per TEAM namespace. The OTEL Operator reads this when a pod in the
# same namespace carries the annotation:
#     instrumentation.opentelemetry.io/inject-python: "true"
# It injects an init container that installs the Python SDK + auto-instrumentation and points
# it at the team's TENANT gateway. resourceAttributes stamp tenant/team onto every signal.
#
# Gateway service DNS = <collector-name>-collector.<ns>.svc  (created by the operator).

# Shared env applied to all four (enable OTLP metrics + logs over http/protobuf).
# --- tenant-a / team-1 (Payments) ---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: python
  namespace: tenant-a-team-1
spec:
  exporter:
    endpoint: http://gateway-tenant-a-collector.observability.svc.cluster.local:4318
  propagators: [tracecontext, baggage]
  sampler:
    type: parentbased_always_on
  resource:
    resourceAttributes:
      tenant: tenant-a
      team: team-1
  env:
    - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
    - { name: OTEL_METRICS_EXPORTER, value: otlp }
    - { name: OTEL_LOGS_EXPORTER, value: otlp }
    - { name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED, value: "true" }
---
