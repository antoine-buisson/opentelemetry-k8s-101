# One OTEL Collector "gateway" per TENANT. Each gateway stamps its tenant's X-Scope-OrgID
# on every export, which is what makes tenant data land in separate Mimir/Loki/Tempo streams.
# Apps in a tenant's team namespaces send OTLP to their tenant gateway (service DNS below).
#
# Mirror of config/tenants.yaml (tenant-a, tenant-b). Managed by the OTEL Operator.
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: gateway-tenant-a
  namespace: observability
  labels:
    otel-k8s-101/tenant: tenant-a
spec:
  mode: deployment
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  config:
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch: {}
      resource:
        attributes:
          - { key: tenant, value: tenant-a, action: upsert }
    exporters:
      # otlphttp appends /v1/{traces,metrics,logs} to the endpoint below.
      otlphttp/tempo:
        endpoint: http://tempo.observability.svc.cluster.local:4318
        headers: { X-Scope-OrgID: tenant-a }
      otlphttp/mimir:
        endpoint: http://mimir.observability.svc.cluster.local:8080/otlp
        headers: { X-Scope-OrgID: tenant-a }
      otlphttp/loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        headers: { X-Scope-OrgID: tenant-a }
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp/tempo]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp/mimir]
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp/loki]
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: gateway-tenant-b
  namespace: observability
  labels:
    otel-k8s-101/tenant: tenant-b
spec:
  mode: deployment
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  config:
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch: {}
      resource:
        attributes:
          - { key: tenant, value: tenant-b, action: upsert }
    exporters:
      otlphttp/tempo:
        endpoint: http://tempo.observability.svc.cluster.local:4318
        headers: { X-Scope-OrgID: tenant-b }
      otlphttp/mimir:
        endpoint: http://mimir.observability.svc.cluster.local:8080/otlp
        headers: { X-Scope-OrgID: tenant-b }
      otlphttp/loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        headers: { X-Scope-OrgID: tenant-b }
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp/tempo]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp/mimir]
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp/loki]
