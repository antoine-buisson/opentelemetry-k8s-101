# Auto-generated by tools/generate-gateway-config.py from config/tenants.yaml.
# Re-run via: make collectors   (or: make gateway-config)
#
# Single gateway collector: receives OTLP + Jaeger + Prometheus scrape,
# routes signals to per-tenant Mimir/Loki/Tempo backends via the routing connector.

apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: gateway
  namespace: observability
  labels:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/name: otel-gateway
spec:
  mode: deployment
  replicas: 2
  serviceAccount: otel-gateway
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  config:
    extensions:
      health_check: {}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          thrift_http:
            endpoint: 0.0.0.0:14268
          grpc:
            endpoint: 0.0.0.0:14250
      prometheus:
        config:
          scrape_configs:
          - job_name: synthetic-services
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - tenant-a-team-1
                - tenant-a-team-2
                - tenant-b-team-1
                - tenant-b-team-2
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
              action: keep
              regex: 'true'
            - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $${1}:$${2}
              target_label: __address__
            - source_labels:
              - __meta_kubernetes_pod_label_otel_k8s_101_tenant
              target_label: tenant
            - source_labels:
              - __meta_kubernetes_pod_label_otel_k8s_101_team
              target_label: team
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: k8s_namespace
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: k8s_pod
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 75
        spike_limit_percentage: 25
      k8sattributes:
        passthrough: false
        auth_type: serviceAccount
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: connection
        extract:
          metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.namespace.name
          - k8s.node.name
          labels:
          - tag_name: tenant
            key: otel-k8s-101/tenant
            from: pod
          - tag_name: team
            key: otel-k8s-101/team
            from: pod
      transform/prometheus_labels:
        metric_statements:
        - context: datapoint
          statements:
          - set(resource.attributes["tenant"], attributes["tenant"]) where attributes["tenant"] != nil
          - set(resource.attributes["team"], attributes["team"]) where attributes["team"] != nil
          - delete_key(attributes, "tenant")
          - delete_key(attributes, "team")
      batch: {}
    connectors:
      routing/traces:
        default_pipelines:
        - traces/unknown
        error_mode: ignore
        table:
        - statement: route() where resource.attributes["tenant"] == "tenant-a" and resource.attributes["team"] == "team-1"
          pipelines:
          - traces/tenant-a-team-1
        - statement: route() where resource.attributes["tenant"] == "tenant-a" and resource.attributes["team"] == "team-2"
          pipelines:
          - traces/tenant-a-team-2
        - statement: route() where resource.attributes["tenant"] == "tenant-b" and resource.attributes["team"] == "team-1"
          pipelines:
          - traces/tenant-b-team-1
        - statement: route() where resource.attributes["tenant"] == "tenant-b" and resource.attributes["team"] == "team-2"
          pipelines:
          - traces/tenant-b-team-2
      routing/metrics:
        default_pipelines:
        - metrics/unknown
        error_mode: ignore
        table:
        - statement: route() where resource.attributes["tenant"] == "tenant-a" and resource.attributes["team"] == "team-1"
          pipelines:
          - metrics/tenant-a-team-1
        - statement: route() where resource.attributes["tenant"] == "tenant-a" and resource.attributes["team"] == "team-2"
          pipelines:
          - metrics/tenant-a-team-2
        - statement: route() where resource.attributes["tenant"] == "tenant-b" and resource.attributes["team"] == "team-1"
          pipelines:
          - metrics/tenant-b-team-1
        - statement: route() where resource.attributes["tenant"] == "tenant-b" and resource.attributes["team"] == "team-2"
          pipelines:
          - metrics/tenant-b-team-2
      routing/logs:
        default_pipelines:
        - logs/unknown
        error_mode: ignore
        table:
        - statement: route() where resource.attributes["tenant"] == "tenant-a" and resource.attributes["team"] == "team-1"
          pipelines:
          - logs/tenant-a-team-1
        - statement: route() where resource.attributes["tenant"] == "tenant-a" and resource.attributes["team"] == "team-2"
          pipelines:
          - logs/tenant-a-team-2
        - statement: route() where resource.attributes["tenant"] == "tenant-b" and resource.attributes["team"] == "team-1"
          pipelines:
          - logs/tenant-b-team-1
        - statement: route() where resource.attributes["tenant"] == "tenant-b" and resource.attributes["team"] == "team-2"
          pipelines:
          - logs/tenant-b-team-2
    exporters:
      otlphttp/tempo-tenant-a-team-1:
        endpoint: http://tempo.observability.svc.cluster.local:4318
        headers:
          X-Scope-OrgID: tenant-a-team-1
      otlphttp/mimir-tenant-a-team-1:
        endpoint: http://mimir.observability.svc.cluster.local:8080/otlp
        headers:
          X-Scope-OrgID: tenant-a-team-1
      otlphttp/loki-tenant-a-team-1:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        headers:
          X-Scope-OrgID: tenant-a-team-1
      otlphttp/tempo-tenant-a-team-2:
        endpoint: http://tempo.observability.svc.cluster.local:4318
        headers:
          X-Scope-OrgID: tenant-a-team-2
      otlphttp/mimir-tenant-a-team-2:
        endpoint: http://mimir.observability.svc.cluster.local:8080/otlp
        headers:
          X-Scope-OrgID: tenant-a-team-2
      otlphttp/loki-tenant-a-team-2:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        headers:
          X-Scope-OrgID: tenant-a-team-2
      otlphttp/tempo-tenant-b-team-1:
        endpoint: http://tempo.observability.svc.cluster.local:4318
        headers:
          X-Scope-OrgID: tenant-b-team-1
      otlphttp/mimir-tenant-b-team-1:
        endpoint: http://mimir.observability.svc.cluster.local:8080/otlp
        headers:
          X-Scope-OrgID: tenant-b-team-1
      otlphttp/loki-tenant-b-team-1:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        headers:
          X-Scope-OrgID: tenant-b-team-1
      otlphttp/tempo-tenant-b-team-2:
        endpoint: http://tempo.observability.svc.cluster.local:4318
        headers:
          X-Scope-OrgID: tenant-b-team-2
      otlphttp/mimir-tenant-b-team-2:
        endpoint: http://mimir.observability.svc.cluster.local:8080/otlp
        headers:
          X-Scope-OrgID: tenant-b-team-2
      otlphttp/loki-tenant-b-team-2:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        headers:
          X-Scope-OrgID: tenant-b-team-2
      debug/unknown:
        verbosity: basic
    service:
      extensions:
      - health_check
      pipelines:
        traces/in:
          receivers:
          - otlp
          - jaeger
          processors:
          - memory_limiter
          - k8sattributes
          - batch
          exporters:
          - routing/traces
        metrics/in:
          receivers:
          - otlp
          - prometheus
          processors:
          - memory_limiter
          - k8sattributes
          - transform/prometheus_labels
          - batch
          exporters:
          - routing/metrics
        logs/in:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - k8sattributes
          - batch
          exporters:
          - routing/logs
        traces/unknown:
          receivers:
          - routing/traces
          exporters:
          - debug/unknown
        metrics/unknown:
          receivers:
          - routing/metrics
          exporters:
          - debug/unknown
        logs/unknown:
          receivers:
          - routing/logs
          exporters:
          - debug/unknown
        traces/tenant-a-team-1:
          receivers:
          - routing/traces
          exporters:
          - otlphttp/tempo-tenant-a-team-1
        metrics/tenant-a-team-1:
          receivers:
          - routing/metrics
          exporters:
          - otlphttp/mimir-tenant-a-team-1
        logs/tenant-a-team-1:
          receivers:
          - routing/logs
          exporters:
          - otlphttp/loki-tenant-a-team-1
        traces/tenant-a-team-2:
          receivers:
          - routing/traces
          exporters:
          - otlphttp/tempo-tenant-a-team-2
        metrics/tenant-a-team-2:
          receivers:
          - routing/metrics
          exporters:
          - otlphttp/mimir-tenant-a-team-2
        logs/tenant-a-team-2:
          receivers:
          - routing/logs
          exporters:
          - otlphttp/loki-tenant-a-team-2
        traces/tenant-b-team-1:
          receivers:
          - routing/traces
          exporters:
          - otlphttp/tempo-tenant-b-team-1
        metrics/tenant-b-team-1:
          receivers:
          - routing/metrics
          exporters:
          - otlphttp/mimir-tenant-b-team-1
        logs/tenant-b-team-1:
          receivers:
          - routing/logs
          exporters:
          - otlphttp/loki-tenant-b-team-1
        traces/tenant-b-team-2:
          receivers:
          - routing/traces
          exporters:
          - otlphttp/tempo-tenant-b-team-2
        metrics/tenant-b-team-2:
          receivers:
          - routing/metrics
          exporters:
          - otlphttp/mimir-tenant-b-team-2
        logs/tenant-b-team-2:
          receivers:
          - routing/logs
          exporters:
          - otlphttp/loki-tenant-b-team-2
